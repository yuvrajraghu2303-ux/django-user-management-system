<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New User</title>
</head>
<body>
    <h1>Add New User</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Role:</label>
        <input type="text" name="role" required>
        <br><br>

        <button type="submit">Save User</button>
    </form>

    <br>
    <a href="/users/">Back to User List</a>
</body>
</html>
